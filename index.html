<!DOCTYPE html>
<html lang="ga">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Roth na Bliana</title>
  <style>
    body {
      margin: 0;
      background: #102116;
      color: #f8f4e8;
      font-family: Arial, sans-serif
    }

    header {
      background: #1f4d2e;
      padding: 15px;
      text-align: center
    }

    h1 {
      margin: 0;
      color: #c9a227
    }

    .card {
      background: #183220;
      margin: 12px;
      border-radius: 12px;
      padding: 15px
    }

    .screen {
      display: none;
      padding-bottom: 90px
    }

    .screen.active {
      display: block
    }

    .bottomNav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #1f4d2e;
      border-top: 2px solid #c9a227;
      display: flex;
      justify-content: space-around;
      align-items: center
    }

    .bottomNav button {
      background: none;
      border: none;
      color: #fff
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px
    }

    .day {
      background: #234030;
      padding: 8px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer
    }
  </style>
</head>

<body>
  <header>
    <h1>Roth na Bliana</h1>
    <div>Wheel of the Year</div>
  </header>
  <section id="homeScreen" class="screen active">
    <div class="card">
      <h2 id="irishDate"></h2>
      <div id="englishDate"></div>
    </div>
    <div class="card">
      <h2>Focal an Lae</h2>
      <div id="wordBox"></div>
    </div>
    <div class="card">
      <h2>Next Birthday</h2>
      <div id="upcomingBirthdays"></div>
    </div>
  </section>
  <section id="calendarScreen" class="screen">

  <div class="card">

    <div style="display:flex;justify-content:space-between;align-items:center;">

      <button onclick="changeMonth(-1)">◀</button>

      <div>
        <h2 id="monthIrish"></h2>
        <div id="monthEnglish"></div>
      </div>

      <button onclick="changeMonth(1)">▶</button>

    </div>

    <div id="calendar" class="calendar"></div>

  </div>

  <div class="card">

    <h3>Dáta Roghnaithe</h3>

    <div id="selectedDate">
      Roghnaigh lá
    </div>

  </div>

</section>
  <section id="wheelScreen" class="screen">
    <div class="card">
      <h2>Roth na Bliana</h2>
      <div id="festivalInfo">Festival information</div>
    </div>
  </section>
  <section id="learnScreen" class="screen">
    <div class="card">
      <h2>Foghlaim Gaeilge</h2>
      <p>Learning section.</p>
    </div>
  </section>
  <section id="settingsScreen" class="screen">
    <div class="card">
      <h2>Socruithe</h2>
      <label>Name</label>
<input id="birthdayName">

<label>Day</label>
<input id="birthdayDay" type="number">

<label>Month</label>
<input id="birthdayMonth" type="number">

<label>Year</label>
<input id="birthdayYear" type="number">

<button onclick="addBirthday()">
Add Birthday
</button>

<h3>Saved Birthdays</h3>

<div id="birthdayList">
</div>
  </section>
  <nav class="bottomNav"><button onclick="showScreen('homeScreen')">Baile</button><button
      onclick="showScreen('calendarScreen')">Féilire</button><button
      onclick="showScreen('wheelScreen')">Roth</button><button
      onclick="showScreen('learnScreen')">Foghlaim</button><button
      onclick="showScreen('settingsScreen')">Socruithe</button></nav>
  <script>function showScreen(id) {
  document
    .querySelectorAll(".screen")
    .forEach(s => s.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");
}

const monthsIrish = [
  "Eanáir",
  "Feabhra",
  "Márta",
  "Aibreán",
  "Bealtaine",
  "Meitheamh",
  "Iúil",
  "Lúnasa",
  "Meán Fómhair",
  "Deireadh Fómhair",
  "Samhain",
  "Nollaig"
];

const monthsEnglish = [
  "January",
  "February",
  "March",
  "April",
  "May",
  "June",
  "July",
  "August",
  "September",
  "October",
  "November",
  "December"
];

let currentDate = new Date();
let currentMonth = currentDate.getMonth();
let currentYear = currentDate.getFullYear();

const daysIrish = [
  "Dé Domhnaigh",
  "Dé Luain",
  "Dé Máirt",
  "Dé Céadaoin",
  "Déardaoin",
  "Dé hAoine",
  "Dé Sathairn"
];

document.getElementById("irishDate").textContent =
  daysIrish[currentDate.getDay()] + " " +
  currentDate.getDate() + " " +
  monthsIrish[currentDate.getMonth()] + " " +
  currentDate.getFullYear();

document.getElementById("englishDate").textContent =
  currentDate.toDateString();

document.getElementById("wordBox").innerHTML =
  "<strong>uisce</strong><br>ISH-ka<br>water";

function drawCalendar() {

  document.getElementById("monthIrish").textContent =
    monthsIrish[currentMonth];

    document.getElementById("monthEnglish").textContent =
monthsEnglish[currentMonth];

  const calendar =
    document.getElementById("calendar");

  calendar.innerHTML = "";

// Irish weekday headers

const weekdays = [
  "L",
  "M",
  "C",
  "D",
  "A",
  "H",
  "S"
];

weekdays.forEach(day => {
  const header = document.createElement("div");

  header.textContent = day;

  header.style.fontWeight = "bold";
  header.style.textAlign = "center";
  header.style.color = "#c9a227";

  calendar.appendChild(header);
});

  const firstDay =
    new Date(currentYear, currentMonth, 1);

  const daysInMonth =
    new Date(currentYear, currentMonth + 1, 0).getDate();

  const startDay =
    (firstDay.getDay() + 6) % 7;

  for (let i = 0; i < startDay; i++) {
    const blank = document.createElement("div");
    calendar.appendChild(blank);
  }

  for (let day = 1; day <= daysInMonth; day++) {

    const cell = document.createElement("div");

    cell.className = "day";

    const hasBirthday = birthdays.some(b =>
  Number(b.day) === day &&
  Number(b.month) === currentMonth + 1
);

cell.innerHTML = hasBirthday
  ? `${day}<br>🎂`
  : day;

    cell.onclick = function () {

  document
    .querySelectorAll(".day")
    .forEach(d => d.style.border = "none");

  cell.style.border = "2px solid #c9a227";

  document.getElementById(
    "selectedDate"
  ).textContent =
    day + " " +
    monthsIrish[currentMonth] +
    " " +
    currentYear;
};

    calendar.appendChild(cell);
  }
}

function changeMonth(direction) {
  currentMonth += direction;

  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }

  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }

  showNextBirthday();
drawCalendar();
}

let birthdays =
  JSON.parse(
    localStorage.getItem("birthdays")
  ) || [];
function displayBirthdays() {

  const list =
    document.getElementById("birthdayList");

  if (!list) return;

  list.innerHTML = birthdays
    .map(b =>
      `🎂 ${b.name}<br>${b.day}/${b.month}/${b.year}`
    )
    .join("<hr>");
}
function addBirthday() {

  const name =
    document.getElementById("birthdayName").value;

  const day =
    document.getElementById("birthdayDay").value;

  const month =
    document.getElementById("birthdayMonth").value;

  const year =
    document.getElementById("birthdayYear").value;
if (!name || !day || !month || !year) {
  return;
}
  birthdays.push({
    name,
    day,
    month,
    year
  });
  localStorage.setItem(
  "birthdays",
  JSON.stringify(birthdays)
);
document.getElementById("birthdayName").value = "";
document.getElementById("birthdayDay").value = "";
document.getElementById("birthdayMonth").value = "";
document.getElementById("birthdayYear").value = "";
  const list =
    document.getElementById("birthdayList");

  list.innerHTML = birthdays
  .map(b =>
    `🎂 ${b.name}<br>${b.day}/${b.month}/${b.year}`
  )
  .join("<hr>");
}
function showNextBirthday() {

  if (birthdays.length === 0) {
    return;
  }

  const today = new Date();

  let next = null;
  let smallestDiff = Infinity;

  birthdays.forEach(b => {

    let birthday = new Date(
      today.getFullYear(),
      Number(b.month) - 1,
      Number(b.day)
    );

    if (birthday < today) {
      birthday.setFullYear(
        today.getFullYear() + 1
      );
    }

    const diff =
      birthday - today;

    if (diff < smallestDiff) {
      smallestDiff = diff;
      next = b;
    }

  });

  if (next) {

    const daysAway =
      Math.ceil(
        smallestDiff / 86400000
      );

    document.getElementById(
      "upcomingBirthdays"
    ).innerHTML = `
      🎂 ${next.name}<br>
      ${next.day}/${next.month}<br>
      ${daysAway} days away
    `;
  }
}

displayBirthdays();
showNextBirthday();
drawCalendar();

</script>
</body>
</html>
